services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:///./financial_intelligence.db
      FRONTEND_ORIGIN: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SAMPLE_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
